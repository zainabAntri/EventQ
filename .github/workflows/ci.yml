name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push should not keep burning runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  # Fast feedback: everything that needs no database runs first and in parallel
  # with nothing else to wait for.
  static:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        # Includes the architecture boundary rules: a Prisma or Nest import
        # inside a domain/ folder fails the build here.
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eventq
          POSTGRES_PASSWORD: eventq_ci
          POSTGRES_DB: eventq
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eventq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eventq:eventq_ci@localhost:5432/eventq?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Verify migrations apply to a clean database
        # Runs the migration files themselves, exactly as production does, so a
        # broken migration fails here rather than on a deploy night.
        run: pnpm db:deploy

      - name: Verify schema shape
        # `?schema=public` is a PRISMA parameter. psql goes through libpq, which
        # treats a URI query string as connection keywords and rejects any it
        # does not recognise — so the very same URL that Prisma migrates with is
        # unusable here. Stripping the query string is what reconciles them.
        #
        # The counts are compared explicitly rather than piped into `grep -qx`.
        # A silent grep reports only that the check failed, never what the value
        # actually was, which is precisely the information needed to fix it.
        run: |
          PSQL_URL="${DATABASE_URL%%\?*}"

          assert_count() {
            if [ "$3" != "$2" ]; then
              echo "::error::$1: expected $2, found $3"
              exit 1
            fi
            echo "$1: $3"
          }

          TABLES=$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name<>'_prisma_migrations'")
          assert_count "domain tables" 19 "$TABLES"

          EXTENSIONS=$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM pg_extension WHERE extname IN ('vector','pg_trgm','pgcrypto')")
          assert_count "required extensions" 3 "$EXTENSIONS"
        env:
          PGPASSWORD: eventq_ci

      - name: Seed is idempotent
        # Two runs must leave identical row counts. Proven, not assumed.
        run: |
          PSQL_URL="${DATABASE_URL%%\?*}"
          pnpm db:seed > /dev/null
          FIRST=$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM questions")
          pnpm db:seed > /dev/null
          SECOND=$(psql "$PSQL_URL" -tAc "SELECT count(*) FROM questions")
          test "$FIRST" = "$SECOND" || { echo "::error::Seed is not idempotent: $FIRST then $SECOND"; exit 1; }
        env:
          PGPASSWORD: eventq_ci

      - name: Integration tests
        # Testcontainers starts its own throwaway Postgres, independent of the
        # service container above.
        run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          # Build-time placeholders only. Real values come from Vercel and AWS
          # Secrets Manager at deploy time and are never present in CI.
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still a leaked
          # secret, and scanning only the tip would miss it entirely.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
